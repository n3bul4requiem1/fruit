<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Aqua Glass Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Top Gloss Sheen -->
    <linearGradient id="glossSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Screen Glass Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2b3f"/>
      <stop offset="100%" stop-color="#081824"/>
    </linearGradient>

    <!-- Button Gradient Vista Green -->
    <linearGradient id="btnGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="51%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Button Gradient Crystal Blue -->
    <linearGradient id="btnBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="51%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Button Gradient Cyan Operator -->
    <linearGradient id="btnCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="51%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <filter id="aeroShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022a4a" flood-opacity="0.5"/>
    </filter>
    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#082f49" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)" stroke="#e0f2fe" stroke-width="6" filter="url(#aeroShadow)"/>

  <!-- Inner Glass Border Highlight -->
  <rect x="32" y="32" width="448" height="448" rx="102" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3"/>

  <!-- Iconic Frutiger Aero Wave / Curved Horizon -->
  <path d="M 24 310 C 140 260, 360 360, 488 280 L 488 488 C 488 488, 488 488, 488 488 L 24 488 Z" fill="#0284c7" opacity="0.35"/>
  <path d="M 24 350 C 180 290, 320 400, 488 330 L 488 488 C 488 488, 488 488, 488 488 L 24 488 Z" fill="#38bdf8" opacity="0.25"/>

  <!-- LCD Screen Display with Glass Glare -->
  <g transform="translate(76, 80)">
    <rect width="360" height="96" rx="20" fill="url(#screenGrad)" stroke="#38bdf8" stroke-width="2.5" filter="url(#btnShadow)"/>
    <!-- Glass sheen on screen -->
    <path d="M 4 4 L 356 4 C 356 4, 356 42, 280 48 L 4 48 Z" fill="url(#glossSheen)" opacity="0.5"/>
    <!-- LCD Text / Numbers -->
    <text x="336" y="66" fill="#38bdf8" font-family="monospace, sans-serif" font-weight="bold" font-size="44" text-anchor="end" letter-spacing="3" filter="drop-shadow(0 0 8px #38bdf8)">777.0</text>
    <text x="24" y="64" fill="#7dd3fc" font-family="sans-serif" font-size="20" opacity="0.75">AeroCalc</text>
  </g>

  <!-- Keypad Grid Aqua Buttons -->
  <g transform="translate(76, 206)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="76" height="64" rx="16" fill="url(#btnBlue)" filter="url(#btnShadow)"/>
    <text x="38" y="44" fill="#0369a1" font-family="sans-serif" font-weight="bold" font-size="30" text-anchor="middle">7</text>

    <rect x="94" y="0" width="76" height="64" rx="16" fill="url(#btnBlue)" filter="url(#btnShadow)"/>
    <text x="132" y="44" fill="#0369a1" font-family="sans-serif" font-weight="bold" font-size="30" text-anchor="middle">8</text>

    <rect x="188" y="0" width="76" height="64" rx="16" fill="url(#btnBlue)" filter="url(#btnShadow)"/>
    <text x="226" y="44" fill="#0369a1" font-family="sans-serif" font-weight="bold" font-size="30" text-anchor="middle">9</text>

    <rect x="282" y="0" width="78" height="64" rx="16" fill="url(#btnCyan)" stroke="#bae6fd" stroke-width="2" filter="url(#btnShadow)"/>
    <text x="321" y="44" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="34" text-anchor="middle">÷</text>

    <!-- Row 2 -->
    <rect x="0" y="80" width="76" height="64" rx="16" fill="url(#btnBlue)" filter="url(#btnShadow)"/>
    <text x="38" y="124" fill="#0369a1" font-family="sans-serif" font-weight="bold" font-size="30" text-anchor="middle">4</text>

    <rect x="94" y="80" width="76" height="64" rx="16" fill="url(#btnBlue)" filter="url(#btnShadow)"/>
    <text x="132" y="124" fill="#0369a1" font-family="sans-serif" font-weight="bold" font-size="30" text-anchor="middle">5</text>

    <rect x="188" y="80" width="76" height="64" rx="16" fill="url(#btnBlue)" filter="url(#btnShadow)"/>
    <text x="226" y="124" fill="#0369a1" font-family="sans-serif" font-weight="bold" font-size="30" text-anchor="middle">6</text>

    <rect x="282" y="80" width="78" height="64" rx="16" fill="url(#btnCyan)" stroke="#bae6fd" stroke-width="2" filter="url(#btnShadow)"/>
    <text x="321" y="122" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="34" text-anchor="middle">×</text>

    <!-- Row 3: 1, 2, 3, + -->
    <rect x="0" y="160" width="76" height="64" rx="16" fill="url(#btnBlue)" filter="url(#btnShadow)"/>
    <text x="38" y="204" fill="#0369a1" font-family="sans-serif" font-weight="bold" font-size="30" text-anchor="middle">1</text>

    <rect x="94" y="160" width="76" height="64" rx="16" fill="url(#btnBlue)" filter="url(#btnShadow)"/>
    <text x="132" y="204" fill="#0369a1" font-family="sans-serif" font-weight="bold" font-size="30" text-anchor="middle">2</text>

    <rect x="188" y="160" width="76" height="64" rx="16" fill="url(#btnBlue)" filter="url(#btnShadow)"/>
    <text x="226" y="204" fill="#0369a1" font-family="sans-serif" font-weight="bold" font-size="30" text-anchor="middle">3</text>

    <!-- Large Green = Button -->
    <rect x="282" y="160" width="78" height="64" rx="16" fill="url(#btnGreen)" stroke="#bbf7d0" stroke-width="2" filter="url(#btnShadow)"/>
    <text x="321" y="205" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="36" text-anchor="middle" filter="drop-shadow(0 1px 2px #14532d)">=</text>
  </g>

  <!-- Floating Crystal Aqua Bubbles -->
  <g>
    <!-- Bubble 1 -->
    <circle cx="410" cy="110" r="32" fill="url(#bgGrad)" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
    <ellipse cx="400" cy="98" rx="12" ry="6" transform="rotate(-30 400 98)" fill="#ffffff" opacity="0.95"/>
    <circle cx="418" cy="124" r="4" fill="#ffffff" opacity="0.6"/>

    <!-- Bubble 2 -->
    <circle cx="95" cy="430" r="26" fill="url(#bgGrad)" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <ellipse cx="87" cy="420" rx="9" ry="5" transform="rotate(-30 87 420)" fill="#ffffff" opacity="0.9"/>

    <!-- Bubble 3 -->
    <circle cx="430" cy="435" r="20" fill="url(#bgGrad)" stroke="#ffffff" stroke-width="1.8" opacity="0.85"/>
    <ellipse cx="424" cy="427" rx="7" ry="4" transform="rotate(-30 424 427)" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Big Curving Glass Specular Reflection across Top Half -->
  <path d="M 28 140 C 28 76, 76 28, 140 28 L 372 28 C 436 28, 484 76, 484 140 C 370 230, 160 210, 28 140 Z" fill="url(#glossSheen)" opacity="0.65" pointer-events="none"/>
</svg>
